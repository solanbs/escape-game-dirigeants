# Template Article : page de journal, de blog ou d'un centre d'aide.

# --- Enveloppe : lue par le serveur et le navigateur du jeu ------------------
url: ""  # identifiant unique de la page + barre d'adresse, ex. "actu-justice.fr/prudhommes/carbona"
template: Article
visible: { roles: [master, ops] }  # qui peut ouvrir la page ; ajouter after / before pour « à partir de / jusqu'à »
onglet:
  icone: ""  # un emoji, affiché dans l'onglet du navigateur

# --- Contenu : transmis tel quel au template --------------------------------
data:
  couleur: ""  # couleur principale du site → variable CSS --couleur-principale

  site:                    # le journal / blog / portail qui publie l'article
    nom: ""
    slogan: ""
    logo: ""
    recherche: false       # true = afficher une barre de recherche (décorative)
    rubriques: []          # menu du site, ex. ["Actualités", "Sport"]

  fil_ariane: []           # ex. ["Accueil", "Justice"]
  rubrique: ""
  titre: ""
  chapo: ""                # texte d'introduction sous le titre
  auteur: ""
  date: ""
  temps_lecture: ""        # ex. "4 min"

  corps:
    # Un élément par bloc, dans l'ordre d'affichage. Supprimer les blocs inutiles,
    # répéter ceux dont on a besoin. Gras dans le texte : **mot**.
    # Tout bloc accepte aussi "id" et "visible" (ex. visible: { after: noeud.sortie }).
    - type: paragraphe
      texte: ""

    - type: intertitre
      texte: ""

    - type: liste
      elements:
        - ""                       # texte simple…
        - icone: ""                # …ou élément détaillé (tous les champs facultatifs)
          label: ""
          texte: ""
          note: ""

    - type: etapes                 # liste numérotée
      elements:
        - titre: ""
          texte: ""

    - type: encadre
      ton: info                    # info | alerte
      icone: ""
      titre: ""
      texte: ""
      avertissement: ""
      bouton: ""

    - type: citation
      texte: ""
      auteur: ""

    - type: tableau
      titre: ""
      colonnes: ["", ""]
      lignes:
        - ["", ""]

    - type: image
      fichier: ""                  # nom du fichier image
      legende: ""

    - type: chiffres
      elements:
        - valeur: ""
          label: ""

    - type: cartes
      elements:
        - icone: ""
          titre: ""
          texte: ""

    - type: personnes
      titre: ""
      liste:
        - nom: ""
          poste: ""
          bio: ""
          photo: ""

    - type: actus
      elements:
        - date: ""
          titre: ""
          extrait: ""

    - type: temoignages
      elements:
        - texte: ""
          auteur: ""

    - type: contact
      titre: ""
      texte: ""
      adresse: ""
      telephone: ""
      email: ""

  colonne: []              # colonne de droite facultative : mêmes blocs que "corps"

  tags: []
