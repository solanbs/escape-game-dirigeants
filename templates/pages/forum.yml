# Template Forum : un fil de discussion.

# --- Enveloppe : lue par le serveur et le navigateur du jeu ------------------
url: ""  # identifiant unique de la page + barre d'adresse, ex. "actu-justice.fr/prudhommes/carbona"
template: Forum
visible: { roles: [master, ops] }  # qui peut ouvrir la page ; ajouter after / before pour « à partir de / jusqu'à »
onglet:
  icone: ""  # un emoji, affiché dans l'onglet du navigateur

# --- Contenu : transmis tel quel au template --------------------------------
data:
  couleur: ""  # couleur principale du site → variable CSS --couleur-principale

  site:
    nom: ""
    logo: ""

  fil_ariane: []           # ex. ["Portail", "Électricité", "Alarmes"]
  titre: ""
  resolu: false            # true = préfixe "[Résolu]" devant le titre

  messages:                # dans l'ordre chronologique
    - id: ""               # facultatif ; obligatoire si le message a un "visible"
      # visible: { after: noeud.sortie }  # facultatif : message visible seulement après cette sortie
      auteur: ""
      avatar: ""           # lettre ou emoji (vide = initiale de l'auteur)
      statut: ""           # ex. "Installateur Pro" (facultatif)
      date: ""             # ex. "14/05/2026 à 09:12"
      texte: ""            # plusieurs paragraphes : utiliser "|" et séparer par une ligne vide
