# Template IndexFile : listing de fichiers en ligne ("Index of /...").

# --- Enveloppe : lue par le serveur et le navigateur du jeu ------------------
url: ""  # identifiant unique de la page + barre d'adresse, ex. "actu-justice.fr/prudhommes/carbona"
template: IndexFile
visibleTo: [master, ops]  # rôles qui peuvent ouvrir la page
# when: noeud.sortie      # facultatif : page disponible seulement après cette sortie du scénario
onglet:
  icone: ""  # un emoji, affiché dans l'onglet du navigateur

# --- Contenu : transmis tel quel au template --------------------------------
data:
  couleur: ""  # couleur principale du site → variable CSS --couleur-principale

  chemin: ""               # ex. "/manuals/supersecure/2019/"

  fichiers:
    - id: ""               # facultatif ; obligatoire si le fichier a un "when"
      # when: noeud.sortie # facultatif : fichier visible seulement après cette sortie
      nom: ""
      date: ""             # ex. "04-Sep-2019 09:11"
      taille: ""           # ex. "45K"
      mis_en_avant: false  # true = ligne surlignée
      contenu: ""          # texte de l'aperçu (vide = fichier non consultable).
                           # Utiliser "|" pour plusieurs lignes.
