# Type "index_fichiers" : listing de fichiers en ligne ("Index of /...").
type: index_fichiers

# --- En-tête commun -------------------------------------------------------
google:                  # résultat affiché dans le faux Google
  domaine: ""            # ex. "exemple.fr" (affiché aussi dans la barre d'adresse)
  titre: ""
  introduction: ""
icone_onglet: ""         # un emoji, affiché dans l'onglet du navigateur
couleur: ""              # couleur principale du site, ex. "#1a73e8"

# --- Contenu ---------------------------------------------------------------
chemin: ""               # ex. "/manuals/supersecure/2019/"

fichiers:
  - nom: ""
    date: ""             # ex. "04-Sep-2019 09:11"
    taille: ""           # ex. "45K"
    mis_en_avant: false  # true = ligne surlignée
    contenu: ""          # texte de l'aperçu (vide = fichier non consultable). Utiliser "|"
                         # pour plusieurs lignes. Le repère {code_alarme} est remplacé par
                         # le code de solutions.yml après validation, par "masquage" avant.

masquage: ""             # texte affiché à la place du code avant validation
indication: ""           # phrase sous l'aperçu
bouton_validation: ""    # texte du bouton qui révèle le code
