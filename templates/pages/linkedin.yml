# Type "linkedin" : profil sur un réseau professionnel.
type: linkedin

# --- En-tête commun -------------------------------------------------------
google:                  # résultat affiché dans le faux Google
  domaine: ""            # ex. "exemple.fr" (affiché aussi dans la barre d'adresse)
  titre: ""
  introduction: ""
icone_onglet: ""         # un emoji, affiché dans l'onglet du navigateur
couleur: ""              # couleur principale du site, ex. "#1a73e8"

# --- Contenu ---------------------------------------------------------------
profil:
  nom: ""
  titre: ""              # phrase sous le nom
  photo: ""
  banniere: ""
  localisation: ""
  relations: ""          # ex. "500+ relations"
  entreprise_actuelle: ""

a_propos: ""

experiences:             # de la plus récente à la plus ancienne
  - poste: ""
    entreprise: ""
    debut: ""            # ex. "mars 2021"
    fin: ""              # vide = "aujourd'hui"
    lieu: ""
    description: ""

formations:
  - ecole: ""
    diplome: ""
    debut: ""
    fin: ""

competences: []

activite:                # publications récentes
  - date: ""
    texte: ""
