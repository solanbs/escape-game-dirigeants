# Type "annonce" : petite annonce de vente.
type: annonce

# --- En-tête commun -------------------------------------------------------
google:                  # résultat affiché dans le faux Google
  domaine: ""            # ex. "exemple.fr" (affiché aussi dans la barre d'adresse)
  titre: ""
  introduction: ""
icone_onglet: ""         # un emoji, affiché dans l'onglet du navigateur
couleur: ""              # couleur principale du site, ex. "#1a73e8"

# --- Contenu ---------------------------------------------------------------
site:
  nom: ""
  logo: ""
  recherche: ""          # texte pré-rempli dans la barre de recherche

titre: ""
prix: ""                 # ex. "150 €"
date: ""                 # ex. "12/09/2026 à 14h30"
lieu: ""

image:
  fichier: ""            # vide = cadre gris avec la légende
  legende: ""

description: ""          # plusieurs paragraphes : utiliser "|" et séparer par une ligne vide

vendeur:
  nom: ""
  avatar: ""             # lettre ou emoji
  type: ""               # ex. "Particulier", "Professionnel"
  note: 5                # nombre d'étoiles, de 0 à 5
  nombre_avis: 0
