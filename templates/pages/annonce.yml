# Template Annonce : petite annonce de vente.

# --- Enveloppe : lue par le serveur et le navigateur du jeu ------------------
url: ""  # identifiant unique de la page + barre d'adresse, ex. "actu-justice.fr/prudhommes/carbona"
template: Annonce
visible: { roles: [master, ops] }  # qui peut ouvrir la page ; ajouter after / before pour « à partir de / jusqu'à »
onglet:
  icone: ""  # un emoji, affiché dans l'onglet du navigateur

# --- Contenu : transmis tel quel au template --------------------------------
data:
  couleur: ""  # couleur principale du site → variable CSS --couleur-principale

  site:
    nom: ""
    logo: ""
    recherche: ""          # texte pré-rempli dans la barre de recherche

  titre: ""
  prix: ""                 # ex. "150 €"
  date: ""                 # ex. "12/09/2026 à 14h30"
  lieu: ""

  image:
    fichier: ""            # vide = cadre gris avec la légende
    legende: ""

  description: ""          # plusieurs paragraphes : utiliser "|" et séparer par une ligne vide

  vendeur:
    nom: ""
    avatar: ""             # lettre ou emoji
    type: ""               # ex. "Particulier", "Professionnel"
    note: 5                # nombre d'étoiles, de 0 à 5
    nombre_avis: 0
