services:
  game:
    build:
      context: .
      target: runtime
    image: escape-game:local
    ports:
      - "${GAME_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      # Fuseau horaire : heure des logs, id de session, journal.
      TZ: ${TZ:-Europe/Paris}
      PORT: 3000
      LOG_LEVEL: info
      # Retirer cette ligne (ou mettre json) pour des logs bruts.
      LOG_FORMAT: pretty
      IOT_GATEWAY_TOKEN: ${IOT_GATEWAY_TOKEN}
      IOT_AUDIO_SMOKE_TEST: ${IOT_AUDIO_SMOKE_TEST:-0}
      IOT_AUDIO_SMOKE_TRACK: ${IOT_AUDIO_SMOKE_TRACK:-alarm.mp3}
    volumes:
      # Prêt pour la base SQLite et les fichiers persistants.
      - ./data:/app/data
    restart: unless-stopped

  gateway:
    build:
      context: .
      target: gateway
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Europe/Paris}
      LOG_LEVEL: ${IOT_GATEWAY_LOG_LEVEL:-info}
      LOG_FORMAT: pretty
      IOT_GATEWAY_TOKEN: ${IOT_GATEWAY_TOKEN}
      IOT_SERVER_URL: http://game:3000
      IOT_AUDIO_DRIVER: ${IOT_AUDIO_DRIVER:-mpv}
      IOT_AUDIO_DIR: ${IOT_AUDIO_DIR:-/app/audio}
      IOT_AUDIO_DEVICE: ${IOT_AUDIO_DEVICE:-alsa/default}
      IOT_DOOR_DRIVER: ${IOT_DOOR_DRIVER:-fake}
      IOT_KEYPAD_DRIVER: ${IOT_KEYPAD_DRIVER:-fake}
      IOT_DEVICES_HTTP_HOST: 0.0.0.0
      IOT_DEVICES_HTTP_PORT: ${IOT_DEVICES_HTTP_PORT:-8080}
      IOT_DEVICE_TOKEN: ${IOT_DEVICE_TOKEN:-}
    ports:
      # Bus HTTP des ESP32 (clavier à code + capteur de porte).
      - "${IOT_DEVICES_HTTP_PORT:-8080}:${IOT_DEVICES_HTTP_PORT:-8080}"
    devices:
      - /dev/snd:/dev/snd
    # GID du groupe audio de l'hôte (getent group audio). Le conteneur tourne en
    # root dans un premier temps ; ajuster si on descend les privilèges.
    group_add:
      - "29"
    volumes:
      - ./audio:/app/audio:ro
    depends_on:
      - game
    restart: unless-stopped
