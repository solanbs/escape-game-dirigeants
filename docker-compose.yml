services:
  game:
    build:
      context: .
      target: runtime
    image: escape-game:local
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      # Retirer cette ligne (ou mettre json) pour des logs bruts.
      LOG_FORMAT: pretty
      IOT_GATEWAY_TOKEN: ${IOT_GATEWAY_TOKEN}
    volumes:
      # Prêt pour la base SQLite et les fichiers persistants.
      - ./data:/app/data
    restart: unless-stopped

  gateway:
    build:
      context: .
      target: gateway
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      LOG_FORMAT: pretty
      IOT_GATEWAY_TOKEN: ${IOT_GATEWAY_TOKEN}
      IOT_SERVER_URL: http://game:3000
      IOT_AUDIO_DRIVER: ${IOT_AUDIO_DRIVER:-mpv}
      IOT_AUDIO_DIR: ${IOT_AUDIO_DIR:-/app/audio}
      IOT_AUDIO_DEVICE: ${IOT_AUDIO_DEVICE:-alsa/default}
    devices:
      - /dev/snd:/dev/snd
    # GID du groupe audio de l'hôte (getent group audio). Le conteneur tourne en
    # root dans un premier temps ; ajuster si on descend les privilèges.
    group_add:
      - "29"
    volumes:
      - ./audio:/app/audio:ro
    depends_on:
      - game
    restart: unless-stopped
